<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .timezone-name {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .time-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
            margin: 15px 0;
            letter-spacing: 2px;
        }

        .date-display {
            font-size: 0.95rem;
            color: #999;
            margin-bottom: 10px;
        }

        .timezone-offset {
            font-size: 0.85rem;
            color: #667eea;
            background: #f0f0f0;
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .controls h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .timezone-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .timezone-selector input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .timezone-selector input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-add {
            background: #667eea;
            color: white;
        }

        .btn-add:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .btn-reset {
            background: #ff6b6b;
            color: white;
        }

        .btn-reset:hover {
            background: #ee5a52;
            transform: scale(1.05);
        }

        .btn-remove {
            background: #ffa502;
            color: white;
            padding: 8px 16px;
            font-size: 0.9rem;
            flex: 0;
        }

        .btn-remove:hover {
            background: #ff8c00;
        }

        .remove-btn-container {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .clock-card {
            position: relative;
        }

        .predefined-timezones {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
        }

        .tz-btn {
            padding: 8px 12px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .tz-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .info-text {
            color: #999;
            font-size: 0.9rem;
            margin-top: 15px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .time-display {
                font-size: 2rem;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🌍 Global Time Zones</h1>
        <p>Track time across multiple time zones in real-time</p>
    </div>

    <div class="clocks-grid" id="clocksGrid">
        <!-- Clock cards will be inserted here -->
    </div>

    <div class="controls">
        <h3>Add Custom Time Zone</h3>
        
        <div class="timezone-selector">
            <input 
                type="text" 
                id="tzInput" 
                placeholder="Enter timezone (e.g., America/New_York, Europe/London, Asia/Tokyo)" 
                list="timezones"
            >
            <button class="btn-add" onclick="addTimezone()">Add Timezone</button>
        </div>

        <datalist id="timezones">
            <option value="America/New_York">
            <option value="America/Chicago">
            <option value="America/Denver">
            <option value="America/Los_Angeles">
            <option value="Europe/London">
            <option value="Europe/Paris">
            <option value="Europe/Berlin">
            <option value="Europe/Moscow">
            <option value="Asia/Dubai">
            <option value="Asia/Kolkata">
            <option value="Asia/Bangkok">
            <option value="Asia/Hong_Kong">
            <option value="Asia/Tokyo">
            <option value="Asia/Seoul">
            <option value="Australia/Sydney">
            <option value="Australia/Melbourne">
            <option value="Pacific/Auckland">
            <option value="UTC">
        </datalist>

        <h3 style="margin-top: 20px; margin-bottom: 10px;">Popular Time Zones</h3>
        <div class="predefined-timezones">
            <button class="tz-btn" onclick="addAndDisplay('America/New_York')">New York</button>
            <button class="tz-btn" onclick="addAndDisplay('Europe/London')">London</button>
            <button class="tz-btn" onclick="addAndDisplay('Europe/Paris')">Paris</button>
            <button class="tz-btn" onclick="addAndDisplay('Asia/Dubai')">Dubai</button>
            <button class="tz-btn" onclick="addAndDisplay('Asia/Tokyo')">Tokyo</button>
            <button class="tz-btn" onclick="addAndDisplay('Australia/Sydney')">Sydney</button>
            <button class="tz-btn" onclick="addAndDisplay('UTC')">UTC</button>
        </div>

        <div class="button-group" style="margin-top: 15px;">
            <button class="btn-reset" onclick="resetClocks()">Reset All</button>
        </div>

        <p class="info-text">💡 Tip: Add your favorite time zones or use the predefined buttons for quick access.</p>
    </div>
</div>

<script>
    let selectedTimezones = ['America/New_York', 'Europe/London', 'Asia/Tokyo', 'UTC'];

    function initializePage() {
        // Load from localStorage if available
        const saved = localStorage.getItem('selectedTimezones');
        if (saved) {
            selectedTimezones = JSON.parse(saved);
        } else {
            localStorage.setItem('selectedTimezones', JSON.stringify(selectedTimezones));
        }
        updateClocks();
        setInterval(updateClocks, 1000);
    }

    function updateClocks() {
        const grid = document.getElementById('clocksGrid');
        grid.innerHTML = '';

        selectedTimezones.forEach((tz, index) => {
            const card = createClockCard(tz, index);
            grid.appendChild(card);
        });
    }

    function createClockCard(timezone, index) {
        const card = document.createElement('div');
        card.className = 'clock-card';

        try {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const dateFormatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                weekday: 'short',
                year: 'numeric',
                month: 'short',
                day: '2-digit'
            });

            const time = formatter.format(now);
            const date = dateFormatter.format(now);

            // Calculate offset
            const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
            const tzDate = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
            const offset = (tzDate - utcDate) / (1000 * 60 * 60);
            const offsetStr = offset >= 0 ? `UTC+${offset}` : `UTC${offset}`;

            card.innerHTML = `
                <div class="timezone-name">${timezone}</div>
                <div class="date-display">${date}</div>
                <div class="time-display">${time}</div>
                <div class="timezone-offset">${offsetStr}</div>
                ${index >= 4 ? `<button class="btn-remove" onclick="removeTimezone('${timezone}')">Remove</button>` : ''}
            `;
        } catch (error) {
            card.innerHTML = `
                <div class="timezone-name">${timezone}</div>
                <div style="color: #ff6b6b; padding: 20px;">Invalid timezone</div>
                <button class="btn-remove" onclick="removeTimezone('${timezone}')">Remove</button>
            `;
        }

        return card;
    }

    function addTimezone() {
        const input = document.getElementById('tzInput');
        const timezone = input.value.trim();

        if (!timezone) {
            alert('Please enter a timezone');
            return;
        }

        // Validate timezone
        try {
            new Date().toLocaleString('en-US', { timeZone: timezone });
        } catch (error) {
            alert(`Invalid timezone: ${timezone}`);
            return;
        }

        if (!selectedTimezones.includes(timezone)) {
            selectedTimezones.push(timezone);
            localStorage.setItem('selectedTimezones', JSON.stringify(selectedTimezones));
            input.value = '';
            updateClocks();
        } else {
            alert('This timezone is already added');
        }
    }

    function addAndDisplay(timezone) {
        if (!selectedTimezones.includes(timezone)) {
            selectedTimezones.push(timezone);
            localStorage.setItem('selectedTimezones', JSON.stringify(selectedTimezones));
            updateClocks();
        }
    }

    function removeTimezone(timezone) {
        selectedTimezones = selectedTimezones.filter(tz => tz !== timezone);
        localStorage.setItem('selectedTimezones', JSON.stringify(selectedTimezones));
        updateClocks();
    }

    function resetClocks() {
        selectedTimezones = ['America/New_York', 'Europe/London', 'Asia/Tokyo', 'UTC'];
        localStorage.setItem('selectedTimezones', JSON.stringify(selectedTimezones));
        document.getElementById('tzInput').value = '';
        updateClocks();
    }

    // Allow Enter key to add timezone
    document.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('tzInput');
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTimezone();
            }
        });
        initializePage();
    });
</script>

</body>
</html>
